server:
  port: 8080
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/mannvaasam?createDatabaseIfNotExist=true&serverTimezone=UTC
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
app:
  jwt-secret: ${JWT_SECRET:CHANGE_ME_USE_A_LONG_SECRET}
  demo-seller-password: ${DEMO_SELLER_PASSWORD:}