services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: mannvaasam
      MYSQL_USER: mannvaasam
      MYSQL_PASSWORD: change-me
      MYSQL_ROOT_PASSWORD: change-me
    ports: ["3306:3306"]
    volumes: [mysql_data:/var/lib/mysql]
  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/mannvaasam?createDatabaseIfNotExist=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: mannvaasam
      SPRING_DATASOURCE_PASSWORD: change-me
      JWT_SECRET: change-me
      DEMO_SELLER_PASSWORD: change-me
    depends_on: [mysql]
    ports: ["8080:8080"]
  ai-service:
    build: ./ai-service
    ports: ["8000:8000"]
  frontend:
    build: ./frontend
    ports: ["5173:80"]
volumes:
  mysql_data: