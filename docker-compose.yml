services:
  mysql:
    image: mysql:8.4
    env_file: .env
    ports: ["3306:3306"]
    volumes: [mysql_data:/var/lib/mysql]
  backend:
    build: ./backend
    env_file: .env
    depends_on: [mysql]
    ports: ["8080:8080"]
  ai-service:
    build: ./ai-service
    env_file: .env
    ports: ["8000:8000"]
  frontend:
    build: ./frontend
    env_file: .env
    ports: ["5173:80"]
volumes:
  mysql_data: